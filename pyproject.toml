[project]
name = "crypto-desk"
version = "0.1.0"
description = "Multi-agent CoinSpot day-trading desk (paper trading by default)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "network: test needs internet access (skipped unless --network is given)",
]
